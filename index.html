<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 AI Coding的一万种用法</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></svg>');
            animation: rotate 30s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        header h1 {
            font-size: 2.8rem;
            color: #fff;
            margin-bottom: 15px;
            position: relative;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }
        
        header p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stats-bar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }
        
        .filters {
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        
        .filter-btn.active {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-color: transparent;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .sort-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .sort-tab {
            padding: 10px 25px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .sort-tab.active {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.2);
        }
        
        .card-category {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 15px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }
        
        .card h3 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .card p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .tag {
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            font-size: 0.8rem;
            color: #667eea;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .author {
            font-size: 0.85rem;
            color: #888;
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: #666;
        }
        
        .stat svg {
            width: 16px;
            height: 16px;
        }
        
        .twitter-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1DA1F2;
            color: #fff;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .twitter-btn:hover {
            background: #1a91da;
            transform: scale(1.05);
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal.active {
            display: block;
        }
        
        .modal-content {
            max-width: 800px;
            margin: 50px auto;
            background: linear-gradient(145deg, #1a1a3e 0%, #0f0f23 100%);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .modal-header {
            padding: 30px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .modal-header h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .close-btn:hover {
            background: rgba(102, 126, 234, 0.5);
        }
        
        .modal-stats {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .modal-stat {
            text-align: center;
        }
        
        .modal-stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .modal-stat-label {
            font-size: 0.85rem;
            color: #888;
        }
        
        .search-box {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .search-input::placeholder {
            color: #666;
        }
        
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .stats-bar {
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎯 AI Coding的一万种用法</h1>
        <p>收集Twitter上讨论最多、最新的AI Coding技巧，让你的编程效率飞起来！</p>
    </header>
    
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">种用法</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="categoryCount">0</div>
            <div class="stat-label">个分类</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="totalLikes">0</div>
            <div class="stat-label">总点赞</div>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" class="search-input" placeholder="🔍 搜索AI Coding用法..." id="searchInput">
    </div>
    
    <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="all">全部</button>
    </div>
    
    <div class="container">
        <div class="sort-tabs">
            <button class="sort-tab active" data-sort="likes">🔥 最热门</button>
            <button class="sort-tab" data-sort="date">🕐 最新</button>
        </div>
        
        <div class="cards-grid" id="cardsGrid"></div>
    </div>
    
    <footer>
        <p>🎯 AI Coding的一万种用法 | 数据来源: Twitter/X</p>
        <p>最后更新: <span id="lastUpdate">-</span></p>
    </footer>
    
    <!-- Modal -->
    <div class="modal" id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <div class="modal-header">
                <span class="card-category" id="modalCategory"></span>
                <h2 id="modalTitle"></h2>
                <p id="modalAuthor"></p>
            </div>
            <div class="modal-body">
                <p id="modalDescription" style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 20px;"></p>
                
                <div class="card-tags" id="modalTags"></div>
                
                <div class="modal-stats">
                    <div class="modal-stat">
                        <div class="modal-stat-number" id="modalLikes">0</div>
                        <div class="modal-stat-label">点赞</div>
                    </div>
                    <div class="modal-stat">
                        <div class="modal-stat-number" id="modalRetweets">0</div>
                        <div class="modal-stat-label">转发</div>
                    </div>
                    <div class="modal-stat">
                        <div class="modal-stat-number" id="modalDate">-</div>
                        <div class="modal-stat-label">发布时间</div>
                    </div>
                </div>
                
                <a href="#" target="_blank" class="twitter-btn" id="modalTwitter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.37h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    查看原帖
                </a>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script>
        let currentCategory = 'all';
        let currentSort = 'likes';
        let searchQuery = '';
        
        function init() {
            // 渲染分类筛选器
            const categories = Object.keys(groupedByCategory);
            const filtersContainer = document.getElementById('categoryFilters');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.onclick = () => filterByCategory(cat);
                filtersContainer.appendChild(btn);
            });
            
            // 统计
            document.getElementById('totalCount').textContent = aiCodingUses.length;
            document.getElementById('categoryCount').textContent = categories.length;
            const totalLikes = aiCodingUses.reduce((sum, item) => sum + item.likes, 0);
            document.getElementById('totalLikes').textContent = totalLikes.toLocaleString();
            document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('zh-CN');
            
            // 搜索
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderCards();
            });
            
            // 排序
            document.querySelectorAll('.sort-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentSort = tab.dataset.sort;
                    renderCards();
                });
            });
            
            renderCards();
        }
        
        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category || (category === 'all' && btn.dataset.category === 'all'));
            });
            renderCards();
        }
        
        function renderCards() {
            let filtered = aiCodingUses;
            
            // 分类筛选
            if (currentCategory !== 'all') {
                filtered = groupedByCategory[currentCategory] || [];
            }
            
            // 搜索
            if (searchQuery) {
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(searchQuery) ||
                    item.description.toLowerCase().includes(searchQuery) ||
                    item.tags.some(tag => tag.toLowerCase().includes(searchQuery))
                );
            }
            
            // 排序
            if (currentSort === 'likes') {
                filtered = [...filtered].sort((a, b) => b.likes - a.likes);
            } else {
                filtered = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item.id);
                
                card.innerHTML = `
                    <span class="card-category">${item.category}</span>
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <div class="card-tags">
                        ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-footer">
                        <span class="author">${item.author}</span>
                        <div class="stats">
                            <span class="stat">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                ${item.likes.toLocaleString()}
                            </span>
                            <span class="stat">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                                ${item.retweets.toLocaleString()}
                            </span>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function openModal(id) {
            const item = aiCodingUses.find(i => i.id === id);
            if (!item) return;
            
            document.getElementById('modalCategory').textContent = item.category;
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalAuthor').textContent = `${item.author} ${item.twitterHandle}`;
            document.getElementById('modalDescription').textContent = item.description;
            document.getElementById('modalTags').innerHTML = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
            document.getElementById('modalLikes').textContent = item.likes.toLocaleString();
            document.getElementById('modalRetweets').textContent = item.retweets.toLocaleString();
            document.getElementById('modalDate').textContent = item.date;
            document.getElementById('modalTwitter').href = item.twitterLink;
            
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        init();
    </script>
</body>
</html>
